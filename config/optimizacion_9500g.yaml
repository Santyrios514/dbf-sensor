# Variante de optimizacion.yaml con masa máxima del sensor de 9.5 kg y la cavidad de electrónica en la junta.
# Módulo de optimización del sensor (sensor_opt, spec v3). Unidades de E/S: mm, g, kg/m³, grados.
base_config: config/config.yaml    # hereda pared, electrónica, masas puntuales, lastre, remolque, vuelo, OR

materiales:                        # se suman (o sobrescriben) a los de base_config
  onyx: 1200                       # kg/m^3, ficha técnica Markforged — VERIFICAR con el perfil de impresión
  plomo: 11340

masa:
  m_max_g: 9500                    # masa TOTAL del sensor (corrida pedida: 9.5 kg)
  factor_llenado: 1.0

geometria_fija:
  L_total_mm: 400                  # con e = 0 coincide con la longitud del cuerpo
  nariz: {forma: elipsoide, parametro: null, longitud: {modo: relativo_D, valor: 1.0}}
  aletas:
    n: 4
    rotacion_deg: 45
    material: onyx
    espesor_mm: 2.0                # FIJO (spec v3 §3.2.1)
    fraccion_solida: 1.0           # impresión sólida
    E_GPa: 2.4                     # módulo a tracción, ficha de Onyx
    nu: 0.38                       # supuesto; no está en la ficha
    factor_flutter: 3.0

malla:
  D_mm: [60, 65, 70]
  cola_forma:
    - {forma: parabolica, parametro: 0.5}
    - {forma: parabolica, parametro: 1.0}
    - {forma: conica,     parametro: null}
    - {forma: ogiva,      parametro: null}
  L_t_rel_D: [0.8, 1.0, 1.25, 1.5, 2.0]
  k: [0.15, 0.20, 0.25, 0.30, 0.40, 0.50, 0.60]   # más fina en k bajo, donde está el óptimo del criterio 3
  lambda_LE: [0.0, 0.2, 0.4, 0.6]
  mu_cr: [0.5, 0.75, 1.0]
  r_tip_rel_R: [1.2, 1.4, 1.6, 1.8, 2.0, 2.2, 2.4]
  gamma_ct: [0.3, 0.5, 0.7]
  sigma_flecha: [0.0, 0.5, 1.0]

restricciones:
  SM_min_cal: 1.0
  SM_max_cal: 2.0
  k_min: 0.15
  h_min_mm: 5.0
  c_min_mm: 5.0
  eps_CN: 0.5
  angulo_cola_max_deg: null        # p. ej. 20; null = sin restricción
  cola_base_roma:                  # arrastre de la cola como en OpenRocket (Hoerner): fracción f_b de la base
    angulo_inicio_deg: 9.46        # L_t/ΔD = 3: por debajo la cola no suma arrastre de base (f_b = 0)
    angulo_base_roma_deg: 26.57    # L_t/ΔD = 1: la cola equivale a una base roma (f_b = 1)
    infactible: true               # descarta las colas con L_t/ΔD ≤ 1; entre ambos ángulos, f3 usa k_ef

objetivo:
  pesos: [1.0e6, 1.0e4, 1.0e2, 1.0]
  f4_modo: centro                  # centro | max
  SM_centro_cal: 1.5

ejecucion:
  max_evaluaciones: 2000000
  procesos: auto                   # auto = núcleos disponibles
  refinamiento: {activar: true, top_K: 10}
  verificacion_or: {N_verif: 20, N_cal: 30, tol_cp_mm: 2.0, max_iter_calibracion: 1}   # verificación rápida
  semilla: 12345

numerico:
  n_superficie_aleta: 20           # muestras del cierre P3 → P0 sobre la cola (es_simple es O(n²))
  tol_superficie_mm: 0.01          # P3 sobre la superficie
  tol_masa_max_g: 0.5              # m_total ≥ m_max − tol cuenta como "alcanza m_max" (Pareto)

salida:
  dir: data_opt_9500g
  dir_figuras: figs_opt_9500g
  exportar_ork_top: 5
