[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "sensor-lastre"
version = "0.1.0"
description = "Volumen utilizable y lastre del sensor remolcado del Barracuda (DBF 2026-27, UPB)"
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy>=1.12",
    "pandas",
    "pyyaml",
    "matplotlib",
]

[project.optional-dependencies]
openrocket = ["orlab", "jpype1"]
dev = ["pytest"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
